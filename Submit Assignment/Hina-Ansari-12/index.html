<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICard</title>
    <link rel="stylesheet" type="text/css" href="./css/icard.css">
</head>
<body>
    <div class="id-card-wrapper-front ">
        <div class="id-card-background"></div>
            <div class="id-blue"></div>
            <div class="id-shadow2"></div>
            <div class="id-shadow1"></div>
            <div class="id-shadow3"></div>
            <div class="id-shadow4"></div>
            <div class="id-shadow5"></div>
            <div class="id-shadow6"></div>
            <div class="id-shadow7"></div>
            <div class="id-shadow8"></div>
            <div class="id-shadow9"></div>
            <div class="id-shadow10"></div>
            <div class="id-white"></div> 
            <div class="id-circle"></div> 
            
    



    <div class="id-card-content">
        <div class="org-logo">
            <img src="./img/logo.png" alt="Logo">
        </div>
        <!-- Photo -->
        <div class="user-photo">
            <img src="img/profile.jpg" alt="Photo">
        </div>

        <!-- Name -->
        <div class="user-name">Akanksha Dube</div>
        
        <!-- ID Number -->
        <div class="id-number">ID: 123456</div>
        
        <!-- Job Title/Grade/Class -->
        <div class="id-title">Jr.Software Engineer </div> <!-- or Grade: 10 -->

        <!-- Organization/School/College Information -->
        <div class="org-name">Apnasite It Services</div>
        <div class="org-address">Kalewadi,Pune</div>
    </div>
</div>
    <div class="id-card-wrapper-back">
  
        <!-- Card Background Back Side -->
        <div class="id-shadow2"></div>
        <div class="id-shadow1"></div>
        <div class="id-shadow3"></div>
        <div class="id-shadow4"></div>
        <div class="id-shadow5"></div>
        <div class="id-shadow6"></div>
        <div class="id-shadow7"></div>
        <div class="id-shadow8"></div>
        <div class="id-shadow9"></div>
        <div class="id-shadow10"></div>
        
             <!-- Content of ID Card Back Side -->
        <div class="id-card-content">
            <div class="id-policy">
                The Employee ID card is company property. Always carry it. Report loss/theft immediately. Misuse results in disciplinary action. Terms may change.
            </div>
            <div class="org-qr">
                <img src="img/qr.jpg" alt="QR Code">
            </div>
              <!-- Logo -->
        <div class="org-logo">
            <img src="img/logo.png" alt="Logo">
        </div>
        </div>
        
    </div>   
</body>
</html>
